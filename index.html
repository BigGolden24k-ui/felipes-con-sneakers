<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felipes con Sneakers</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1eff7;--card:#fff;--ink:#140f20;--mut:#6b6580;--line:#dcd7ea;--ac:#5a2d9c;--on:#fff;--te:#1fa9b6;--y:#ffc72c;--ok:#1f7a3d;--bad:#b3322e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a10;--card:#17141f;--ink:#f4f2fa;--mut:#a29cb8;--line:#2c2738;--ac:#a77bff;--on:#0b0a10;--ok:#6fd08c;--bad:#f08a85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0a10;--card:#17141f;--ink:#f4f2fa;--mut:#a29cb8;--line:#2c2738;--ac:#a77bff;--on:#0b0a10}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:20}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:7px 12px}
.brand{display:flex;align-items:center;gap:9px}.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--ac)}
.brand b{font:italic 800 1.25rem/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;display:block}.brand small{color:var(--mut);font-size:.72rem}
.seg{display:flex;background:var(--bg);border-radius:99px;padding:3px}.seg button{border:0;background:none;border-radius:99px;padding:6px 12px;min-height:34px;font-size:.85rem;color:var(--mut)}.seg button.on{background:var(--ac);color:var(--on);font-weight:700}
.demo{background:var(--y);color:#222;font-size:.76rem;text-align:center;padding:4px 8px}
main{max-width:640px;margin:0 auto;padding:14px 14px 130px}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;font-style:italic;text-transform:uppercase;line-height:1;margin:0}h1{font-size:2.4rem;font-weight:800}h2{font-size:1.7rem;font-weight:800;margin:22px 0 10px}h3{font-size:1.2rem;font-weight:800;margin:10px 0 6px}
.mut{color:var(--mut);font-size:.88rem}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{background:#0b0a10;color:#fff;border-radius:22px;padding:20px 16px;border-bottom:6px solid var(--te)}.hero p{margin:8px 0 14px;color:#cfc9e0}
.promo{background:var(--te);color:#06242a;border-radius:16px;padding:14px;margin:12px 0;font-weight:500}.promo b{font:italic 800 1.5rem "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;min-height:44px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}button.y{background:var(--y);color:#222;border-color:var(--y);font-weight:700}
button.sm{min-height:36px;padding:5px 11px;font-size:.88rem}button.d{color:var(--bad)}button.w{width:100%}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px;margin-bottom:8px;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--te);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font:italic 800 1.7rem "Barlow Condensed",Impact,sans-serif;color:var(--ac)}
.ico{width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:1.4rem;flex:none}
.svc{display:flex;gap:12px;align-items:flex-start}.svc>div:nth-child(2){flex:1}
.steps{display:flex;gap:6px;margin:8px 0 12px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--te)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.ph img,.th{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--bg);display:flex;align-items:center}.th svg{width:100%}
.pill{font-size:.76rem;padding:3px 10px;border-radius:99px;background:var(--bg);white-space:nowrap}.pill.y{background:var(--y);color:#222}.pill.ok{background:#dff3e5;color:var(--ok)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;padding:0 0 16px;position:relative}.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}.tl li:last-child::before{display:none}
.tl b{width:24px;height:24px;border-radius:50%;background:var(--line);flex:none;display:grid;place-items:center;font-size:.75rem;color:#fff}.tl li.done b{background:var(--ok)}.tl li.cur b{background:var(--ac);box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 25%,transparent)}.tl li.cur{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.7rem;color:var(--mut);padding:4px 0;min-height:48px;position:relative}nav button span{font-size:1.25rem;line-height:1.2}nav button.on{color:var(--ac);font-weight:700}
nav i{position:absolute;top:0;left:56%;background:var(--y);color:#222;border-radius:99px;font-size:.65rem;font-style:normal;padding:0 5px;font-weight:700}
#fab{position:fixed;right:14px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:11;background:#25a244;color:#fff;border:0;border-radius:99px;padding:0 16px;min-height:48px;font-weight:700;box-shadow:0 4px 14px #0004}
#sheet{position:fixed;inset:0;background:#0007;z-index:30;display:none;align-items:flex-end}#sheet>div{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:40;font-size:.9rem;max-width:90%;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer;background:var(--card)}.opt.on{border-color:var(--ac)}
.ck{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:.92rem}.warn{background:#fff3cf;color:#4d3b00;border-radius:10px;padding:8px 10px;font-size:.84rem;margin:6px 0}.cod{background:var(--y);color:#222;border-radius:16px;padding:12px 14px;margin:10px 0;font:italic 800 1.35rem/1.1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase}.cod small{display:block;font:400 .82rem Figtree,sans-serif;text-transform:none;margin-top:4px}
</style>
</head>
<body>
<header id="top"></header><div class="demo" id="demo"></div>
<main id="v"></main><button id="fab" data-a="wa">💬 WhatsApp</button><nav id="nav"></nav><div id="sheet" data-a="close"><div id="sh"></div></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>

 const T=mode==='c'?CT:AT,cur=mode==='c'?ct:at,pc=ords.filter(o=>o.ss===0).length,n=D.items.length;
 $('#nav').innerHTML=(mode==='a'&&!isAdm)?'':T.map(t=>`<button class="${cur===t[0]?'on':''}" data-a="tab" data-id="${t[0]}"><span>${t[1]}</span>${t[2]}${t[0]==='cart'&&D.items.some(x=>x.svc)?`<i>${n}</i>`:''}${t[0]==='ped'&&pc?`<i>${pc}</i>`:''}</button>`).join('');
 $('#demo').textContent=sb?(svState==='ok'?'Servicios reales conectados · Los pedidos siguen siendo de ejemplo · Sin pagos en línea':svState==='err'?'Error al leer los servicios de Supabase':'Conectando con Supabase…'):'Sin conexión: falta configurar config.js';
 $('#v').innerHTML=(mode==='a'&&!isAdm)?loginView():(mode==='a'&&isAdm&&['ped','agenda','cli'].includes(cur)?'<div class="warn">Pedidos de ejemplo: aún no están conectados a Supabase.</div>':'')+(mode==='c'?C:A)[cur]();$('#fab').style.display=mode==='c'?'block':'none';
 if(mode==='a'&&at==='cfg')document.querySelectorAll('[data-a=tday]').forEach(b=>{b.classList.toggle('on',cfg.days.includes(+b.dataset.id))});
}
function readImgs(fs,cb){[...fs].forEach(f=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8));render()};i.src=r.result};r.readAsDataURL(f)})}
const up=()=>{scrollTo(0,0)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='close'){if(e.target.id==='sheet')$('#sheet').style.display='none';return}
 if(a==='x'){$('#sheet').style.display='none';return}
 if(a==='mode'){mode=id;sel=null;render();up()}else if(a==='tab'){mode==='c'?ct=id:at=id;sel=null;render();up()}
 else if(a==='go'){ct=id;step=1;render();up()}
 else if(a==='add'){const x=D.items.find(i=>!i.svc);if(x)x.svc=+id;else D.items.push({l:'',svc:+id,ph:[]});ct='cart';step=1;render();up();toast('Par agregado al pedido')}
 else if(a==='addp'){D.items.push(nit());render()}else if(a==='rm'){D.items.splice(+id,1);render()}
 else if(a==='pickfile')$('#'+id).click();
 else if(a==='n1'){if(D.items.some(x=>!x.svc)){toast('Elige un servicio para cada par');return}step=2;render();up()}
 else if(a==='mode2'){D.mode=id;render()}else if(a==='zone'){D.zone=+id;render()}else if(a==='date'){D.date=id;render()}else if(a==='slot'){D.slot=id;render()}
 else if(a==='n2'){if(!D.date||!D.slot){toast('Elige fecha y horario');return}step=3;render();up()}
 else if(a==='back'){step--;render();up()}
 else if(a==='send'){if(!D.name.trim()||D.phone.replace(/\D/g,'').length<8){toast('Escribe nombre y teléfono');return}if(D.mode==='domicilio'&&!D.addr.trim()){toast('Falta la dirección');return}
  const n='FS-'+(1001+ords.length);ords.push({id:n,name:D.name.trim(),phone:D.phone,addr:D.addr+(D.ref?' ('+D.ref+')':''),mode:D.mode,zone:D.zone,pdate:D.date,pslot:D.slot,edate:'',ss:0,pay:'pendiente',pairs:D.items.map((x,i)=>({id:n+'-'+(i+1),l:x.l||'Par '+(i+1),svc:x.svc,ph:{a:x.ph.map(d=>({d})),d:[],f:[]}}))});
  track=n;tp=null;D=nd();step=1;show(`<h1>Solicitud registrada</h1><p>Código <b>${n}</b>. Estado: <b>Solicitado</b>. Tu reservación <b>no está confirmada</b>: el negocio debe revisarla.</p><p>💵 Paga cuando recibas tus sneakers.</p><p class="mut">Prototipo: este pedido NO se guardó en Supabase todavía; sigue siendo de ejemplo.</p><button class="p w" data-a="gt" data-id="${n}">Ver seguimiento</button>`);render()}
 else if(a==='gt'){$('#sheet').style.display='none';ct='track';track=id;render()}
 else if(a==='find'){track=$('#tk').value;tp=null;render()}else if(a==='t'){track=id;tp=null;render()}else if(a==='tp'){tp=id;render()}
 else if(a==='wa')show(`<h3>Contactar por WhatsApp</h3><p class="mut">Simulación: aquí se abriría WhatsApp con el número del negocio. En el prototipo no se envía nada.</p><button class="p w" data-a="x">Entendido</button>`);
 else if(a==='flt'){flt=id;render()}else if(a==='open'){sel=id;render();up()}else if(a==='bk'){sel=null;render()}
 else if(a==='stage'){const o=ords.find(x=>x.id===id);o.ss=+b.dataset.s;render();toast('Estado: '+SS[o.ss]+' (simulado, sin aviso al cliente)')}
 else if(a==='pay'){const o=ords.find(x=>x.id===id);o.pay=o.pay==='pagado'?'pendiente':'pagado';render();toast('Pago '+(o.pay==='pagado'?'recibido':'pendiente'))}
 else if(a==='delpay'){const o=ords.find(x=>x.id===id);o.ss=7;o.pay='pagado';render();toast('Entregado y pago recibido')}
 else if(a==='newS'){eS={id:0,n:'',d:'',p:''};render()}else if(a==='noS'){eS=null;render()}else if(a==='edS'){const s=svcsAdm.find(x=>x.id==id);eS={id:s.id,n:s.n,d:s.d,p:s.p};render()}
 else if(a==='saveS')saveSvc();else if(a==='actS')toggleSvc(id);else if(a==='login')doLogin();else if(a==='logout')doLogout();else if(a==='retry')loadSvcs();
 else if(a==='ts'){const h=id.replace('✓ ','');cfg.slots=ALLS.filter(x=>x===h?!cfg.slots.includes(x):cfg.slots.includes(x));render()}
 else if(a==='tday'){const i=+id;cfg.days=cfg.days.includes(i)?cfg.days.filter(x=>x!==i):[...cfg.days,i];render()}
 else if(a==='addz'){cfg.zones.push({n:'Nueva zona',pick:null,del:null,promo:false});render()}
});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(t.dataset.of){render();return}
 if(a==='upc')readImgs(t.files,d=>D.items[+t.dataset.id].ph.push(d));
 else if(a==='upa')readImgs(t.files,d=>findP(t.dataset.id)[1].ph[t.dataset.k].push({d}));
 else if(a==='msvc'){D.items[+t.dataset.id].svc=t.value?+t.value:null;render()}
 else if(a==='psvc'){findP(t.dataset.id)[1].svc=+t.value;render()}
 else if(a==='edate'){ords.find(o=>o.id===t.dataset.id).edate=t.value;toast('Fecha de entrega guardada')}
 else if(a==='zp'){cfg.zones[+t.dataset.id].promo=t.checked}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;
 if(k){if(k.startsWith('l.'))D.items[+k.slice(2)].l=t.value;else D[k]=t.value}
 if(t.dataset.e)eS[t.dataset.e]=t.value;if(t.dataset.of)ords.find(o=>o.id===sel)[t.dataset.of]=t.value===''?null:+t.value;
 if(t.dataset.c)cfg[t.dataset.c]=t.type==='number'?+t.value||0:t.value;
 if(t.dataset.z){const[i,f]=t.dataset.z.split('.');cfg.zones[+i][f]=f==='n'?t.value:(t.value===''?null:+t.value)}});
const CF=window.CONFIG||{};
const sb=(window.supabase&&CF.SUPABASE_URL&&CF.SUPABASE_KEY&&!/PEGA/.test(CF.SUPABASE_URL+CF.SUPABASE_KEY))?window.supabase.createClient(CF.SUPABASE_URL,CF.SUPABASE_KEY):null;
const ico=n=>/express/i.test(n)?'⏱️':/color/i.test(n)?'🖌️':/white/i.test(n)?'👟':/cari/i.test(n)?'🎀':/blanque|suela/i.test(n)?'✨':/\bcaps?\b/i.test(n)?'🧢':/repar/i.test(n)?'🔧':'🧼';
const svMsg=()=>!sb?`<div class="warn">${window.supabase?'Falta configurar config.js (URL y publishable key de Supabase).':'No se pudo cargar la librería de Supabase. Revisa tu conexión.'}</div>`:svState==='load'?'<p class="mut">Cargando servicios…</p>':svState==='err'?`<div class="card"><b>No pudimos cargar los servicios.</b><div class="mut">${esc(svErr)}</div><button class="sm p" data-a="retry" style="margin-top:8px">Reintentar</button></div>`:svcs.length?'':'<div class="card mut">No hay servicios activos por ahora.</div>';
const loginView=()=>`<h1>Administrador</h1><p class="mut">Acceso solo para personal autorizado.</p>${!sb?'<div class="warn">Falta configurar config.js con la URL y la publishable key de Supabase.</div>':''}<div class="card"><input id="em" type="email" inputmode="email" autocomplete="username" autocapitalize="none" placeholder="Correo"><input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña">${loginErr?`<div class="warn">${esc(loginErr)}</div>`:''}<button class="p w" data-a="login" ${sb?'':'disabled'}>Entrar</button></div><p class="mut">La seguridad real vive en Supabase (RLS). Esta pantalla solo la hace cómoda de usar.</p>`;
async function checkAdmin(){
 admErr='';if(!sb)return false;
 const {data}=await sb.auth.getSession();sess=data.session;
 if(!sess){isAdm=false;return false}
 const r=await sb.rpc('es_administrador');
 if(r.error)admErr=r.error.message;isAdm=!r.error&&r.data===true;return isAdm}
async function doLogin(){
 const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw){toast('Escribe correo y contraseña');return}
 const r=await sb.auth.signInWithPassword({email:em,password:pw});
 if(r.error){loginErr='Correo o contraseña incorrectos.';render();return}
 if(!(await checkAdmin())){await sb.auth.signOut();sess=null;loginErr=admErr?'No se pudo verificar tus permisos: '+admErr:'Esta cuenta no tiene permisos de administrador.';render();return}
 loginErr='';await loadSvcs();toast('Sesión iniciada')}
async function doLogout(){await sb.auth.signOut();sess=null;isAdm=false;svcsAdm=[];at='ped';sel=null;eS=null;render()}
async function loadSvcs(){
 if(!sb){svState='err';svErr='Sin conexión configurada';render();return}
 svState='load';render();
 const cols='id,nombre,descripcion,precio,activo',m=r=>(r.data||[]).map(x=>({id:x.id,n:x.nombre,d:x.descripcion||'',p:Number(x.precio),activo:x.activo,t:'',i:ico(x.nombre),caps:/\bcaps?\b/i.test(x.nombre)}));
 const a=await sb.from('servicios').select(cols).eq('activo',true).order('id');
 if(a.error){svState='err';svErr=a.error.message;svcs=[];render();return}
 svcs=m(a);svState='ok';
 if(isAdm){const b=await sb.from('servicios').select(cols).order('id');svcsAdm=b.error?[]:m(b)}else svcsAdm=[];
 ords.forEach(o=>o.pairs.forEach((p,i)=>{if(svcs.length&&!svcs.find(s=>s.id===p.svc))p.svc=svcs[i%svcs.length].id}));
 D.items.forEach(x=>{if(x.svc&&!svcs.find(s=>s.id===x.svc))x.svc=null});
 render()}
async function saveSvc(){
 const n=(eS.n||'').trim(),p=eS.p===''||eS.p==null?NaN:+eS.p;
 if(!n){toast('Escribe un nombre');return}if(isNaN(p)||p<0){toast('Escribe un precio válido');return}
 const row={nombre:n,descripcion:(eS.d||'').trim()||null,precio:p};
 const r=eS.id?await sb.from('servicios').update(row).eq('id',eS.id).select():await sb.from('servicios').insert({...row,activo:true}).select();
 if(r.error||!(r.data||[]).length){toast('No se guardó: '+(r.error?r.error.message:'sin permiso'));return}
 eS=null;await loadSvcs();toast('Servicio guardado')}
async function toggleSvc(id){
 const s=svcsAdm.find(x=>x.id==id),r=await sb.from('servicios').update({activo:!s.activo}).eq('id',id).select();
 if(r.error||!(r.data||[]).length){toast('No se pudo cambiar: '+(r.error?r.error.message:'sin permiso'));return}
 await loadSvcs();toast(s.activo?'Servicio desactivado':'Servicio activado')}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')doLogin()});
async function init(){render();if(sb){await checkAdmin();await loadSvcs()}}
init();
</script>
</body>
